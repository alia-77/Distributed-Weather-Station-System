apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-station
spec:
  replicas: 1
  selector:
    matchLabels:
      app: central-station
  template:
    metadata:
      labels:
        app: central-station
    spec:
      containers:
        - name: central-station
          image: weather-monitoring:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MAIN_CLASS
              value: "CentralStation"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: weather-db-secrets
                  key: DB_USER
            - name: DB_PASSWORD 
              valueFrom:
                secretKeyRef:
                  name: weather-db-secrets
                  key: DB_PASS   
          envFrom:
            - configMapRef:
                name: weather-config